shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.position.y = 0.002; shadowCatcher.receiveShadow = true; scene.add(shadowCatcher);

const L = 2.5, Hh = 0.62;

  makeIngot(-0.1, Hh*0.97, -0.05, 0.28);

rim.position.set(-6, 5, -8); rim.target.position.set(0, 0.6, 0); scene.add(rim, rim.target);
